name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # Classifies the diff (PR: against the exact base commit recorded on the PR
  # event; push: against the pre-push SHA) via scripts/detect-changes.sh —
  # the same script commit.sh uses for its staged-file smart skips, so both
  # places agree on what counts as "src/tests/cmake changed". `run_heavy`
  # gates the expensive `test` / `coverage` / `clang-p2996-host-layout` jobs
  # below: a PR touching only docs/ or unrelated top-level files skips
  # straight to green on those instead of spinning up the full matrix. A
  # required status check whose job is skipped via job-level `if:` is
  # reported by GitHub as passed, so this does not block merges on develop's
  # branch protection.
  #
  # Fail-closed by design: this job's output defaults every consumer's `if:`
  # to "run" unless it explicitly says `run_heavy == 'false'` (see those
  # jobs below) — so a failed/erroring changes job, or a detect-changes.sh
  # that produced no output, runs the full suite instead of silently
  # skipping it. Also always runs heavy jobs when anything CI itself
  # consumes changes (workflows, scripts/, .githooks/, CMakePresets.json,
  # commit.sh) — see the grep below — so an edit to that plumbing gets
  # verified by the very jobs it configures instead of skipping itself.
  changes:
    name: detect changed files
    runs-on: ubuntu-24.04
    outputs:
      run_heavy: ${{ steps.detect.outputs.run_heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test detect-changes.sh
        run: ./scripts/tests/test_detect_changes.sh

      - name: Detect changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The exact base commit GitHub recorded when the PR event fired —
            # not a live lookup of origin/develop's current tip, which could
            # have moved since (and would then diff in develop's own newer
            # commits alongside the PR's).
            files=$(git diff --name-only "$BASE_SHA" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            # New/recreated branch, or no usable prior SHA — nothing to
            # safely diff against. Default to the safe choice: run
            # everything, rather than guessing at a diff base.
            echo "No prior SHA to diff against — defaulting to run_heavy=true"
            echo "run_heavy=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          detected=$(printf '%s\n' "$files" | ./scripts/detect-changes.sh)
          eval "$detected"
          : "${HAS_SRC_CHANGES:?detect-changes.sh produced no output}"

          run_heavy=false
          if [[ "$HAS_SRC_CHANGES" == true || "$HAS_TEST_CHANGES" == true \
             || "$HAS_CPP_CHANGES" == true || "$HAS_CMAKE_CHANGES" == true \
             || "$HAS_BENCH_CHANGES" == true ]]; then
            run_heavy=true
          fi

          # Anything CI itself reads or runs forces a full run, regardless of
          # the src/tests/cmake classification above.
          if grep -qE '^(\.github/workflows/|scripts/|\.githooks/|CMakePresets\.json$|commit\.sh$)' <<< "$files"; then
            run_heavy=true
          fi

          echo "run_heavy=$run_heavy" | tee -a "$GITHUB_OUTPUT"

  # The storm-ci image digest is pinned in more than one workflow (ci.yml and
  # clang-tidy-sweep.yml). A job's `container.image` is resolved before any step
  # runs, so it cannot read `env:` or a shared file — the pins have to be literal
  # in each file. Deduplicating them would mean either a setup job on every run
  # or moving the pin into repo variables, which takes it out of git and defeats
  # the point of pinning (see ci.yml's container comment below). Instead, assert
  # they agree, so drift fails loudly here rather than silently running two
  # workflows on two different clang-p2996 builds (as in #498).
  digest-guard:
    name: storm-ci digest consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert storm-ci digests agree
        run: |
          mapfile -t pins < <(grep -rhoE 'storm-ci@sha256:[0-9a-f]{64}' .github/workflows | sort)
          if (( ${#pins[@]} < 2 )); then
            echo "::error::Expected at least 2 storm-ci digest pins, found ${#pins[@]}."
            echo "The image reference may have been renamed or restructured — update this guard."
            exit 1
          fi
          if (( $(printf '%s\n' "${pins[@]}" | sort -u | wc -l) != 1 )); then
            echo "::error::storm-ci digest drift between workflows:"
            grep -rnE 'storm-ci@sha256:[0-9a-f]{64}' .github/workflows
            exit 1
          fi
          echo "OK: ${#pins[@]} storm-ci pins agree — ${pins[0]}"

  # A Claude Code agent whose `description:` spans several physical lines fails
  # the frontmatter parse and is dropped SILENTLY — it never appears in the
  # available-agents list, with no warning anywhere. storm-sql-reviewer and
  # storm-buildsystem-reviewer shipped broken this way and were undispatchable
  # from the day they merged, making CLAUDE.md rule #13 partly unenforceable
  # (#543). Nothing at review time catches it: the file looks fine in a diff.
  # commit.sh runs the same script pre-commit; this job covers the paths that
  # bypass the hook.
  agent-frontmatter:
    name: agent frontmatter (single-line descriptions)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate .claude/agents/*.md frontmatter
        run: ./scripts/check-agent-frontmatter.sh

      - name: Self-test the validator
        run: ./scripts/tests/test_check_agent_frontmatter.sh

  # cmake/clang_p2996_host.cmake resolves clang-p2996's on-disk layout
  # (Linux/amd64 Docker vs. native macOS/arm64) for CMAKE_CXX_STDLIB_MODULES_JSON
  # and cmake/libcxx.cmake's compile/link flags. Nothing else in CI exercises
  # its Darwin branch or its unsupported-host error path (this CI only ever
  # runs the Linux/amd64 branch for real) — this job runs the fake-root test
  # harness so both are covered, not just the one this container's host
  # happens to be. Needs CMake 3.30+ (cmake_minimum_required in the harness),
  # hence the storm-ci container rather than bare ubuntu-24.04's older apt cmake.
  clang-p2996-host-layout:
    name: clang-p2996 host-layout resolution
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    container:
      # Pinned to a specific digest so develop is unaffected by storm-ci image
      # rebuilds. Bump this when publishing a new image (see docker-ci-image.yml).
      image: ghcr.io/spiritecosse/storm-ci@sha256:0da07cc20e580c8a7310dca6974bc1d09406c3d367faa099fe26e03b9a449bee
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test host-layout resolution + import-std symlink behavior
        run: ./scripts/tests/test_libcxx_modules_symlink.sh

  test:
    name: "${{ matrix.preset }} / PG ${{ matrix.postgres }}"
    # ninja-msan is skipped in CI: under import std; (issue #326) GTest's static
    # TEST() macro registration move-constructs std::string through the
    # MSAN-instrumented std module, and MSAN reports the SSO buffer as
    # uninitialized — aborting the binary before any test body runs. This is a
    # false positive in clang-p2996's MSAN + import std; combination, so the
    # preset produces no signal. Re-add the matrix entry once a fixed
    # clang-p2996 build lands (track at #326).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    container:
      # Pinned to a specific digest so develop is unaffected by storm-ci image
      # rebuilds. Bump this when publishing a new image (see docker-ci-image.yml).
      image: ghcr.io/spiritecosse/storm-ci@sha256:0da07cc20e580c8a7310dca6974bc1d09406c3d367faa099fe26e03b9a449bee

    services:
      postgres:
        image: "postgres:${{ matrix.postgres }}"
        env:
          POSTGRES_DB: storm_db
          POSTGRES_USER: storm_db
          POSTGRES_PASSWORD: storm_db
        options: >-
          --health-cmd "pg_isready -U storm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # Core presets — latest PG
          - preset: ninja-debug
            build_dir: debug
            postgres: 17
          - preset: ninja-asan-ubsan
            build_dir: asan-ubsan
            postgres: 17
          - preset: ninja-tsan
            build_dir: tsan
            postgres: 17

          # PG compat — same build, different PG service
          - preset: ninja-debug
            build_dir: debug
            postgres: 14
          - preset: ninja-debug
            build_dir: debug
            postgres: 15
          - preset: ninja-debug
            build_dir: debug
            postgres: 16

          # Release build — the only preset with ENABLE_BENCH=ON, so this is
          # the sole job that compiles benchmarks/ (storm_bench, storm_anchors)
          # and any Release-mode code. Closes the blind spot that let #464 ship
          # green while storm_bench was broken locally. Re-enabled by #466: the
          # old clang-scan-deps SIGSEGV under -O3 -std=c++26 -fmodules is gone
          # with the clang-p2996 build shipped in the pinned storm-ci image.
          - preset: ninja-release
            build_dir: release
            postgres: 17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        # import std; (issue #326): CMake's CXX_MODULE_STD support looks for
        # std.cppm / std.compat.cppm at build/share/libc++/v1/ (declared in
        # libc++.modules.json) but clang-p2996 places them under
        # build/modules/c++/v1/. cmake/libcxx.cmake creates this symlink at
        # configure time when LIBCXX_ROOT is writable, but the clang-p2996
        # dir is read-only in CI — create it here before cmake --preset runs.
        # IMPORTANT: use the same path the previous step symlinked
        # ($(dirname GITHUB_WORKSPACE)/clang-p2996), not /opt/clang-p2996,
        # because that is what LIBCXX_ROOT resolves to during configure.
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          echo "clang_root=$clang_root"
          echo "target=$target  exists=$([ -d "$target" ] && echo yes || echo no)"
          echo "link=$link  exists=$([ -e "$link" ] && echo yes || echo no)"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
            echo "Created symlink: $link -> $target"
          else
            echo "Symlink already exists or target missing — skipping"
            ls -la "$link" 2>/dev/null || true
          fi

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ matrix.preset }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/tests.cmake', 'cmake/bench.cmake') }}
          restore-keys: |
            cpm-${{ matrix.preset }}-
            cpm-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: ./scripts/build-with-retry.sh ${{ matrix.preset }}

      - name: Test
        env:
          STORM_PG_CONNSTR: "host=postgres port=5432 dbname=storm_db user=storm_db password=storm_db"
        run: ctest --test-dir build/${{ matrix.build_dir }} --output-on-failure --no-tests=error

      - name: Atlas integration test
        if: matrix.preset == 'ninja-debug' && matrix.postgres == 17
        run: |
          curl -sSf https://atlasgo.sh | sh
          ./scripts/test-atlas-migration.sh

      # Full-tree clang-tidy sweep — tracked by issue #262.
      # Enable once the pre-existing drift across src/ and tests/ is cleaned up.
      # The clang-p2996 rebuild on 2026-05-11 first surfaced 48 warnings in
      # src/orm/statements/*.cppm + src/db/postgresql.cppm, which are addressed
      # in this PR — but other source files almost certainly carry similar
      # accumulated violations that were masked by the same `.cppm` parse-failure
      # auto-skip in scripts/run_clang_tidy.sh. Enabling --all in CI now would
      # fail every PR. Uncomment after issue #262's cleanup pass lands.
      # - name: clang-tidy full sweep
      #   if: matrix.preset == 'ninja-release' && matrix.postgres == 17
      #   run: ./scripts/run_clang_tidy.sh --all

  # Reproduces commit.sh step 5 (the 100%-line-coverage gate) in CI, so the gate
  # stops being self-reported from one developer's machine. Deliberately NOT a
  # matrix entry on `test`: it needs no postgres service, runs a different build
  # target, and would otherwise be duplicated across the whole PG matrix for no
  # extra signal.
  #
  # What the 100% actually means: 100% of the FILTERED set — 24 files / 8613
  # lines, after `LCOV_EXCL` markers are removed from the denominator (56 markers
  # across 11 files in src/). It is NOT 100% of every line in the tree. Function
  # coverage is ~81% and branch ~92%, which is why the parse below anchors on the
  # `lines.......` row specifically.
  #
  # Preset is `ninja-debug-coverage`, and this job attaches a postgres service.
  # #528 originally proposed running coverage WITHOUT one, on the premise that
  # the local 100% did not depend on a live server. That premise was wrong: the
  # local number was measured on a machine running PG at /var/run/postgresql,
  # which is exactly the socket coverage-run-batched.sh defaults to, so PG tests
  # were quietly running and their lines were quietly counted. With PG genuinely
  # absent the same tree measures ~99.8-99.9% (functions drop 80.6% -> 48.7%),
  # because the PG Connection's constexpr transaction-nesting methods and part of
  # pool.cppm are instantiated only by a live connection.
  #
  # So the choice was never "dependency vs no dependency" — the dependency was
  # already there, just implicit and undeclared. Attaching the service makes it
  # explicit and makes local and CI measure the same thing, which is the
  # comparability the issue was built on. It also means a contributor without a
  # local PG can no longer be blocked by a gate they cannot reproduce.
  #
  # Runs per-PR rather than nightly. Measured cold (rm -rf build, empty ccache,
  # CPM sources cached as CI caches them): configure 1s + build 73s + coverage
  # 19s = 93s on 32 cores. The build phase is the parallel part and dominates, so
  # on a 4-core runner expect roughly 6-9 min wall clock — comparable to the
  # existing matrix jobs and well short of needing a nightly schedule. Revisit if
  # it starts gating PR turnaround.
  coverage:
    name: coverage (100% lines, filtered)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    container:
      # Keep in sync with the `test` job's pin — digest-guard asserts they agree.
      # lcov/genhtml ship in the image already (docker/ci/Dockerfile), so this
      # job needs no image change.
      image: ghcr.io/spiritecosse/storm-ci@sha256:0da07cc20e580c8a7310dca6974bc1d09406c3d367faa099fe26e03b9a449bee

    # A real PostgreSQL is REQUIRED for the 100% gate, not an optimization. The
    # PG Connection's constexpr transaction-nesting methods
    # (postgresql_connection.cppm:171-181) and part of pool.cppm are instantiated
    # only by a live connection — tests/mock_libpq does not reach them — so
    # without a server this job measures ~99.8-99.9% and fails. PG 17 matches the
    # `test` job's primary entry; the coverage number does not vary by PG
    # version, so there is no reason to sweep the matrix here.
    services:
      postgres:
        image: "postgres:17"
        env:
          POSTGRES_DB: storm_db
          POSTGRES_USER: storm_db
          POSTGRES_PASSWORD: storm_db
        options: >-
          --health-cmd "pg_isready -U storm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        # Same rationale as in the `test` job above (issue #326).
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
            echo "Created symlink: $link -> $target"
          else
            echo "Symlink already exists or target missing — skipping"
          fi

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-ninja-debug-${{ hashFiles('cmake/cpm.cmake', 'cmake/tests.cmake', 'cmake/bench.cmake') }}
          restore-keys: |
            cpm-ninja-debug-
            cpm-

      - name: Configure
        run: cmake --preset ninja-debug

      - name: Build
        # Build the test binaries through the retry wrapper first, so a
        # clang-scan-deps segfault (the known C++26 module flake) is retried here
        # rather than failing the coverage step and reading as a coverage drop.
        run: ./scripts/build-with-retry.sh ninja-debug

      - name: Run coverage and enforce 100% line threshold
        env:
          # Points coverage-run-batched.sh at the service container above,
          # overriding its local-socket default. Same value the `test` job uses.
          # Without this the PG-only lines are uncovered and the gate fails.
          STORM_PG_CONNSTR: "host=postgres port=5432 dbname=storm_db user=storm_db password=storm_db"
        run: |
          set -o pipefail
          # Drop stale profraw/profdata — same as commit.sh, prevents a partial
          # merge from reporting phantom uncovered lines.
          cmake --build --preset ninja-debug-coverage --target coverage-clean \
            > /dev/null 2>&1 || true

          # Summary lands under build/ (already gitignored) rather than the
          # workspace root, so the job leaves no stray file in the tree.
          summary=build/debug/coverage-summary.txt
          mkdir -p "$(dirname "$summary")"
          if ! cmake --build --preset ninja-debug-coverage --target coverage \
                 2>&1 | tee "$summary"; then
            echo "::error::Coverage build/analysis failed."
            exit 1
          fi

          # Parse the LINE row specifically. lcov --summary prints
          # "lines.......: 100.0% (8613 of 8613 lines)" alongside functions/branches
          # rows; anchoring on the wrong one would gate against ~81% or ~92% and
          # look like a broken job. Same expression commit.sh:399 uses.
          line_cov=$(grep 'lines\.\.\.\.\.\.\.' "$summary" \
                     | tail -1 | grep -oP '[0-9.]+(?=%)')

          # An unparseable summary must fail loudly, not silently pass — a missing
          # number here would otherwise be indistinguishable from a clean run.
          if [ -z "$line_cov" ]; then
            echo "::error::Could not parse line coverage from the lcov summary."
            tail -20 "$summary"
            exit 1
          fi

          echo "Line coverage: ${line_cov}% (filtered set)"
          if [ "$line_cov" != "100.0" ]; then
            echo "::error::Line coverage ${line_cov}% is below the required 100.0%."
            echo "Uncovered lines (file:line):"
            # Write to a file first, then truncate for display. Piping awk
            # straight into `head -100` would SIGPIPE awk once the limit is hit;
            # under `set -e -o pipefail` that aborts this block at exit 141,
            # losing both the remaining output and the `exit 1` below — i.e. the
            # diagnostics vanish exactly when the drop is biggest.
            #
            # substr($0, 4) rather than `-F:` + $2: an lcov SF: path may itself
            # contain a colon, which field-splitting would silently truncate.
            # `/^DA:/` is anchored, so branch records (BRDA:...) don't match.
            uncovered=build/debug/coverage/uncovered.txt
            awk '
              /^SF:/  { file = substr($0, 4); next }
              /^DA:/  { split(substr($0, 4), d, ","); if (d[2] == 0) print "  " file ":" d[1] }
            ' build/debug/coverage/coverage-filtered.lcov > "$uncovered"
            head -100 "$uncovered"
            total=$(wc -l < "$uncovered")
            if [ "$total" -gt 100 ]; then
              echo "  ... and $((total - 100)) more (see the coverage-html artifact)"
            fi
            exit 1
          fi
          echo "OK: 100.0% line coverage on the filtered set."

      - name: Generate HTML report
        # Runs even on a failed gate — the report is most useful precisely when
        # coverage dropped.
        #
        # Calls genhtml directly rather than the `coverage-html` target: that
        # target DEPENDS on `coverage`, and these are always-out-of-date custom
        # targets, so building it would re-run the entire instrumented test suite
        # a second time. The tracefile it consumes was already produced by the
        # step above, so this just renders it.
        if: always()
        run: |
          lcov_file=build/debug/coverage/coverage-filtered.lcov
          if [ ! -f "$lcov_file" ]; then
            echo "No tracefile at $lcov_file — coverage run did not get far enough."
            exit 0
          fi
          genhtml --rc branch_coverage=1 \
            --rc c_file_extensions=c,h,i,C,H,I,icc,cpp,cc,cxx,hh,hpp,hxx,cppm \
            --ignore-errors deprecated,range,inconsistent \
            --legend --title "Storm ORM Coverage (filtered)" \
            --output-directory build/debug/coverage/html-filtered \
            "$lcov_file"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/debug/coverage/html-filtered/
          retention-days: 14
          if-no-files-found: warn
